services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-velozity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-velozity_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-velozity_dashboard}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-velozity} -d ${POSTGRES_DB:-velozity_dashboard}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-velozity}:${POSTGRES_PASSWORD:-velozity_dev_password}@db:5432/${POSTGRES_DB:-velozity_dashboard}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-replace_with_long_random_access_secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-replace_with_long_random_refresh_secret}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
      PORT: 4000
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
